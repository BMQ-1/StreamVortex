name: StreamVortex CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip xsel

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps chromium

      - name: Test yt-dlp Plugin Discovery
        run: |
          python -c "from yt_dlp import _load_all_plugins; from yt_dlp.extractor import gen_extractors; _load_all_plugins(); ies = [ie.IE_NAME for ie in gen_extractors()]; assert 'tiktok:smartlive' in ies or 'tiktok:live' in ies; print('Plugin successfully registered in yt-dlp lookup!')"

      - name: Run Test Suite
        run: |
          python -m unittest discover tests
