# ===== OUTPUT =====
-o "~/Downloads/%(playlist|)s/%(title).70B_%(epoch)s.%(ext)s"
-o "subtitle:~/Downloads/Subs/%(title).70B_%(epoch)s.%(ext)s"
-o "thumbnail:~/Downloads/Thumbnails/%(title).70B_%(epoch)s.%(ext)s"

# ===== FORMAT PRIORITY =====
# Pick ONE. Comment out the other two.

# 🥇 Start at 4K → 2K → 1080p fallback
# -f "(bestvideo[vcodec~='^av01'][height>=2160]+bestaudio[acodec=opus]/bestvideo[vcodec~='^vp9'][height>=2160]+bestaudio[acodec=opus]/bestvideo[height>=2160]+bestaudio[acodec=opus]/bestvideo[vcodec~='^av01'][height>=1440]+bestaudio[acodec=opus]/bestvideo[vcodec~='^vp9'][height>=1440]+bestaudio[acodec=opus]/bestvideo[height>=1440]+bestaudio[acodec=opus]/bestvideo[vcodec~='^av01'][height>=1080]+bestaudio[acodec=opus]/bestvideo[vcodec~='^vp9'][height>=1080]+bestaudio[acodec=opus]/bestvideo[height>=1080]+bestaudio[acodec=opus]/bestvideo+bestaudio/best)"

# 🥈 Start at 2K → 1080p fallback (skip 4K entirely)
-f "(bestvideo[vcodec~='^av01'][height>=1440]+bestaudio[acodec=opus]/bestvideo[vcodec~='^vp9'][height>=1440]+bestaudio[acodec=opus]/bestvideo[height>=1440]+bestaudio[acodec=opus]/bestvideo[vcodec~='^av01'][height>=1080]+bestaudio[acodec=opus]/bestvideo[vcodec~='^vp9'][height>=1080]+bestaudio[acodec=opus]/bestvideo[height>=1080]+bestaudio[acodec=opus]/bestvideo+bestaudio/best)"

# 🥉 1080p only (best codec available at that res)
# -f "(bestvideo[vcodec~='^av01'][height>=1080]+bestaudio[acodec=opus]/bestvideo[vcodec~='^vp9'][height>=1080]+bestaudio[acodec=opus]/bestvideo[height>=1080]+bestaudio[acodec=opus]/bestvideo+bestaudio/best)"
-S "hdr,res,fps,vcodec:av01,acodec:opus"
--merge-output-format mkv

# ===== AUTH =====
# --cookies "C:\Tools\cookies.txt"

# ===== EXTERNAL DOWNLOADER (aria2c) =====
# Opens multiple parallel TCP connections per file — bypasses YouTube's
# per-connection throttle cap that limits native yt-dlp to ~4MB/s.
# Requires aria2c.exe reachable via PATH or in the same folder as yt-dlp.exe.
--downloader aria2c
--downloader-args "aria2c:-x 16 -s 16 -k 1M"

# ===== THUMBNAIL =====
--write-thumbnail
--embed-thumbnail
--convert-thumbnail jpg

# ===== NETWORK =====
--force-ipv4
--retries 10
--fragment-retries 20
# --sleep-requests 0.5
--sleep-interval 1
--max-sleep-interval 3
--js-runtimes node
-N 6
# --buffer-size 16K
# --http-chunk-size 10M

# ===== SUBTITLES =====
--write-subs
--sub-langs "en"
--sub-format "vtt/srt/best"
--convert-subs srt
# --embed-subs

# Optional: Un-comment line below to delete raw sub files after embedding
# --compat-options no-keep-subs

# ===== SPONSORBLOCK =====
--sponsorblock-mark all
# --sponsorblock-remove "sponsor,selfpromo"

# ===== DOWNLOAD QUALITY OF LIFE =====
--continue
# --no-part
--no-mtime
# --no-playlist

# ===== ARCHIVE =====
# --download-archive "C:/Tools/Videos/archive.txt"

# ===== CLEANUP =====
# --compat-options no-keep-subs
# --rm-cache-dir

# ===== OUTPUT CONSOLE =====
--console-title
# --no-progress
--progress
# --progress-delta 10
# --newline